name: Security Review

# DEMO-REPO VARIANT of the review agent's workflow.
#
# This repository is a *target* to be reviewed — it does not contain the agent
# code. So unlike the agent's own self-review workflow, this one first checks
# out the public code-review-agent repo and runs it against this repo's PRs.
#
# Uses `pull_request` (not `pull_request_target`): secrets are never exposed to
# fork code. Fork PRs are therefore not auto-reviewed — run them via the manual
# "Run workflow" button after inspecting the diff.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: "PR URL to review"
        required: true
        type: string
      dry_run:
        description: "Detect only — do not post comments"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number || github.event.inputs.pr_url }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review agent
        uses: actions/checkout@v4
        with:
          repository: akashkuushwahaa/code-review-agent
          path: _agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _agent/requirements.txt

      - name: Install dependencies
        run: pip install -r _agent/requirements.txt

      - name: Run security review
        # github.event.* values pass through env, never inlined into the run
        # script, to avoid shell injection.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.inputs.pr_url }}
          REVIEW_SEVERITY_THRESHOLD: ${{ vars.REVIEW_SEVERITY_THRESHOLD || 'medium' }}
          REVIEW_DRY_RUN: ${{ github.event.inputs.dry_run || vars.REVIEW_DRY_RUN || 'false' }}
        run: python _agent/review.py
